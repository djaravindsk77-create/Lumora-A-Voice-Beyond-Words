name: lumora
description: "Lumora – Voice & Safety Companion for Specially-Abled Children. Every voice matters."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.5

  # Routing
  go_router: ^14.6.2

  # Offline storage
  hive_ce: ^2.10.0
  hive_ce_flutter: ^2.2.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Firebase (optional - app runs in Demo Mode without it)
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4

  # Speech / audio
  flutter_tts: ^4.2.3
  speech_to_text: ^7.0.0
  audioplayers: ^6.2.0
  record: ^7.1.1

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Emergency location sharing
  geolocator: ^13.0.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  http: ^1.3.0
  package_info_plus: ^8.1.2
  image_picker: ^1.2.0
  permission_handler: ^12.0.1
  url_launcher: ^6.3.2
  share_plus: ^10.1.3
  file_picker: ^9.0.2

  # Charts
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sample_data/
    - assets/audio/